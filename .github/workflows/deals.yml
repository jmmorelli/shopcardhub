name: deals

# Deals screener — Buy It Now listings below our dated SOLD mark (CoS, Oct 23 2026; Mo in chat: "go on A1").
# Reads: data/indices.json + data/cards/*.json (Pokémon baskets and graded ladders), data/watchlist.json +
# data/feed/sold-marks.json (Bowman). Calls the site's own /api/comps (tool header, customid=deals), one call per
# candidate inside a price band under the mark — ~280 Browse calls a run (--max-calls 300 hard ceiling), 2 runs a day.
# BUDGET (Oct 23 2026 evening, Mo attended): the site shares ONE 5k/day keyset quota across /api/comps, /api/auctions
# and this lane (api/_lib/ebay-budget.js). This lane stops first — /api/comps refuses customid=deals once the keyset is
# down to 2,600 calls, and deals.mjs checks /api/ebay-quota before and during the run. Was 3 runs x 361 calls.
# Publishes ONE derived file, data/feed/deals-latest.json, onto main (served at /feed/, R19) —
# the public-feed path the nightly already uses, so it needs no secret; each publish is one small Vercel build.
# Never blocks anything: a failed run leaves the previous feed in place and /api/deals drops ended rows itself.

on:
  schedule:
    - cron: "40 9,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: main-feed-writers
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Screen deals
        timeout-minutes: 45
        run: |
          mkdir -p "$RUNNER_TEMP/deals"
          node tools/price-engine/deals.mjs --out "$RUNNER_TEMP/deals/deals-latest.json" --pause 650 --max-calls 300

      - name: Publish the feed onto main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/feed
          cp "$RUNNER_TEMP/deals/deals-latest.json" data/feed/deals-latest.json
          git config user.name "price-engine[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed/deals-latest.json
          if git diff --cached --quiet; then echo "No deals change."; exit 0; fi
          git commit -m "deals: screen $(date -u +%FT%H:%MZ)" -m "Task-key: deals" -m "Authority: Mo 2026-10-23 (R42)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (main moved) - rebasing and retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort 2>/dev/null; echo "::error::rebase onto origin/main failed - deals not published"; exit 1; }
            sleep 15
          done
          echo "::error::could not publish the deals feed after 3 attempts"; exit 1
