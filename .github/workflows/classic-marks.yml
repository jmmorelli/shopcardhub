name: classic-marks

# CoS desk, Oct 8 2026 (Mo in chat: "do everything you as the CoS feel is the best route. I approve").
# The 24 classic / WOTC Pokémon set indices used to mark inside the nightly price-snapshot job as ONE call under
# `timeout 40m`. Measured by hand on Oct 8 the group needs ~2-3 h (BS99 alone ~10 min of dated-sale reads), so it
# timed out on Thu Oct 8 (run #74) and was part of the 6-h cancel on Mon Oct 5: 19 tickers sat on their Oct 1 mark.
# They now mark here, after the nightly has published, one ticker per call so a slow or failing ticker costs only
# itself. Same tool, same Mon/Thu UTC mark days (--if-mark-day), same never-block rule. Handoff:
# claude/handoffs/classic-marks-job-2026-10-08.md. The desk checks every Mon/Thu that all 37 live tickers carry a
# market row (kind != divisor) for the day.

on:
  schedule:
    - cron: "30 19 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-data-writers
  cancel-in-progress: false

jobs:
  classic:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout price-data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: price-data
          path: price-data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mark the classic tickers (one call each, time-boxed)
        continue-on-error: true
        timeout-minutes: 300
        run: |
          set +e
          # Desk, Oct 12 2026: GitHub has been starting our crons 6-10 h late (price-snapshot #78: 08:15Z cron, ran 17:53Z).
          # A Mon/Thu 19:30Z run that starts after midnight UTC would no-op under --if-mark-day and the 24 tickers would
          # skip a whole mark day. A scheduled run that lands on Tue/Fri before 18:00 UTC marks as the scheduled day.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOW=$(date -u +%u); HR=$(date -u +%H)
            if { [ "$DOW" = 2 ] || [ "$DOW" = 5 ]; } && [ "$HR" -lt 18 ]; then
              export SIDX_TODAY=$(date -u -d yesterday +%F)
              echo "SIDX_TODAY=$SIDX_TODAY" >> "$GITHUB_ENV"
              echo "::notice::late scheduled run - marking as the scheduled day $SIDX_TODAY"
            fi
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/base"
          : > "$RUNNER_TEMP/marked.list"
          for TK in BS99 JU99 FO99 TR00 NG00 NDC01 NR01 ND02 AQ03 SK03 HF19 TU19 EVS21 CEL21 CZ23 BS1E BSSL JU1E FO1E TR1E NG1E NDC1E NR1E ND1E; do
            cp data/indices.json "$RUNNER_TEMP/idx-pre.json"
            PAGE=$(node -e 'const d=require("./data/indices.json");const p=(d[process.argv[1]]||{}).page||"";process.stdout.write(p.replace(/^\//,"")+(p?".html":""))' "$TK")
            LOWER=$(echo "$TK" | tr 'A-Z' 'a-z')
            if timeout 25m node tools/build-sector-index.mjs --ticker "$TK" --mark --if-mark-day; then
              echo "$TK" >> "$RUNNER_TEMP/marked.list"
            else
              echo "::warning::$TK mark failed - level and page keep the previous mark"
              node tools/ci/merge-ticker-keys.mjs --from "$RUNNER_TEMP/idx-pre.json" --into data/indices.json --tickers "$TK"
              git checkout -q -- "data/cards/$LOWER.json" 2>/dev/null
              if [ -n "$PAGE" ]; then git checkout -q -- "$PAGE" 2>/dev/null; fi
            fi
          done
          # GSTAR Gold Star & Grails board (Oct 13 2026): re-read on mark days only, same time-box, same keep-previous fallback
          if [ -s "$RUNNER_TEMP/marked.list" ]; then
            if GRAILS_TODAY="${SIDX_TODAY:-}" timeout 15m node tools/build-grails.mjs; then
              echo "GSTAR" >> "$RUNNER_TEMP/marked.list"
            else
              echo "::warning::GSTAR read failed - the board keeps its previous read"
              git checkout -q -- data/grails.json gold-star-index.html 2>/dev/null
            fi
          fi
          echo "marked: $(paste -sd, "$RUNNER_TEMP/marked.list")"
          cp data/indices.json "$RUNNER_TEMP/idx-marked.json"
          git diff --name-only > "$RUNNER_TEMP/artifacts.list"
          if [ -s "$RUNNER_TEMP/artifacts.list" ]; then tar -cf "$RUNNER_TEMP/artifacts.tar" -T "$RUNNER_TEMP/artifacts.list"; fi
          git checkout -q -- . 2>/dev/null
          exit 0

      - name: Publish (re-apply, re-bake home + badges, gate, push)
        run: |
          set -e
          if [ ! -s "$RUNNER_TEMP/marked.list" ]; then echo "Nothing marked (not a mark day, or every ticker failed)."; exit 0; fi
          git config user.name "price-engine[bot]"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            BASE=$(cat "$RUNNER_TEMP/base")
            CLASH=$(git diff --name-only "$BASE" origin/main -- $(cat "$RUNNER_TEMP/artifacts.list") 2>/dev/null || true)
            tar -xf "$RUNNER_TEMP/artifacts.tar"
            for f in $CLASH; do git checkout -q origin/main -- "$f"; done
            if echo "$CLASH" | grep -qx "data/indices.json"; then
              node tools/ci/merge-ticker-keys.mjs --from "$RUNNER_TEMP/idx-marked.json" --into data/indices.json --tickers "$(paste -sd, "$RUNNER_TEMP/marked.list")"
            fi
            if [ -n "$CLASH" ]; then echo "::warning::main changed during the marks - kept main's copy of: $CLASH (indices.json keys re-applied)"; fi
            # Desk, Oct 30 2026: a page kept from main still carries the OLD mark while indices.json now has the new one, and
            # audit-site's finish-cost-drift gate FAILs on it (run #6, Oct 29: a nav rebuild touched all 25 pages mid-run, the
            # whole Thursday mark was dropped). Re-bake every clashed page from the merged data - offline, keeps main's edits.
            if [ -n "$CLASH" ]; then
              for TK in $(cat "$RUNNER_TEMP/marked.list"); do
                if [ "$TK" = "GSTAR" ]; then
                  if echo "$CLASH" | grep -qx "gold-star-index.html"; then node tools/build-grails.mjs --bake > /dev/null || echo "::warning::GSTAR re-bake failed"; fi
                  continue
                fi
                PG=$(node -e 'const d=require("./data/indices.json");const p=(d[process.argv[1]]||{}).page||"";process.stdout.write(p.replace(/^\//,"")+(p?".html":""))' "$TK")
                if [ -n "$PG" ] && echo "$CLASH" | grep -qx "$PG"; then
                  node tools/build-sector-index.mjs --ticker "$TK" --bake > /dev/null || echo "::warning::$TK re-bake on main's page failed"
                fi
              done
            fi
            git add $(cat "$RUNNER_TEMP/artifacts.list")
            if FEED_BASE=price-data/data node tools/build-home.mjs; then git add index.html
            else echo "::warning::build-home failed - / keeps its previous bake"; git checkout -- index.html; fi
            # the vintage-vs-modern block under the board reads the marks just published (tools/build-regime.mjs, Oct 13 2026)
            if node tools/build-regime.mjs > /dev/null; then git add index.html
            else echo "::warning::build-regime failed - the block keeps its previous bake"; fi
            if node tools/build-badges.mjs; then git add badge
            else echo "::warning::build-badges failed"; git checkout -- badge 2>/dev/null || true; fi
            # E7 + 30th page wiring (CoS attended with Mo, Oct 19 2026; BLOCKED row of 2026-10-15 13:50): /llms.txt, the index
            # JSON-LD + answer sentence, and the 30th page's TH26 lines go stale at every mark unless re-baked here. All warn-only:
            # a failure keeps the previous bake and never blocks the publish. bake-th26-marks refuses a card whose rawAsOf differs
            # from the index date (one read date per page, R35) - that refusal is a warning, the page keeps its last good bake.
            if node tools/build-llms.mjs > /dev/null; then git add llms.txt llms-full.txt
            else echo "::warning::build-llms failed - llms files keep their previous bake"; git checkout -- llms.txt llms-full.txt 2>/dev/null || true; fi
            LDSTALE=$(node tools/build-index-jsonld.mjs --check 2>/dev/null | sed -n 's/^stale: //p')
            if [ -n "$LDSTALE" ]; then
              if node tools/build-index-jsonld.mjs > /dev/null; then git add $LDSTALE
              else echo "::warning::build-index-jsonld failed - JSON-LD keeps its previous bake"; git checkout -- $LDSTALE 2>/dev/null || true; fi
            fi
            if node tools/bake-th26-marks.mjs; then git add pokemon-30th-anniversary-2026.html
            else echo "::warning::bake-th26-marks refused - the 30th page keeps its previous bake"; git checkout -- pokemon-30th-anniversary-2026.html 2>/dev/null || true; fi
            # gate output is kept so a FAIL names itself in the log (Oct 29 run #6 sent it to /dev/null)
            if ! node tools/audit-prices.mjs > "$RUNNER_TEMP/gate-prices.txt" || ! node tools/site-auditor/audit-site.mjs > "$RUNNER_TEMP/gate-site.txt"; then
              grep -h "FAIL" "$RUNNER_TEMP"/gate-*.txt | head -20
              echo "::error::a gate FAILed on the marked tree - nothing pushed"; exit 1
            fi
            if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
            git commit -q -m "price-engine: classic marks ${SIDX_TODAY:-$(date -u +%F)} ($(paste -sd, "$RUNNER_TEMP/marked.list"))"
            if git push -q origin main; then echo "Classic marks published."; exit 0; fi
            echo "push rejected - retrying"; sleep 10
          done
          echo "could not publish after 3 attempts"; exit 1
