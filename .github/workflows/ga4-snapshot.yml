# GA4 nightly snapshot — keyless read of the Data API via Workload Identity Federation.
# Writes data/ga4-latest.json + data/ga4-history.json to the price-data branch next to the price feed,
# so cloud lanes with no browser can read analytics. Created 2026-09-18 (Mo's yes, NEEDS-MO item 2).
# No secrets: GitHub's OIDC token is exchanged for a short-lived Google token scoped to ga4-reader.

name: ga4-snapshot

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 02:00 PT, ahead of the 04:15 PT Ideas Desk and 05:00 PT Integrity Watch
  workflow_dispatch: {}
  # Oct 26 2026: also run when this file changes on main, so a fix to the job re-runs it at once (no gh on the Mac to dispatch).
  push:
    branches: [main]
    paths: [".github/workflows/ga4-snapshot.yml"]

permissions:
  contents: write
  id-token: write

# Oct 26 2026: own group. In the shared price-data-writers group a queued GA4 run was the "pending" slot and was
# CANCELLED when the next writer queued behind the 1 h 44 min price snapshot (run 40350582539, Oct 26: no GA4 that day).
# GitHub keeps one pending run per group; the push loop below rebases and retries instead.
concurrency:
  group: ga4-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout price-data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: price-data
          path: price-data

      - name: Prepare data dir
        run: mkdir -p price-data/data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google (keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/61398544448/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: ga4-reader@shopcardhub-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly

      - name: Run GA4 snapshot
        env:
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node tools/ga4-snapshot.mjs --out price-data/data

      - name: Run Bing snapshot (ledger #61; never blocks GA4)
        continue-on-error: true
        env:
          BING_WMT_KEY: ${{ secrets.BING_WMT_KEY }}
        run: node tools/bing-snapshot.mjs --out price-data/data

      - name: Commit and push to price-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd price-data
          if [ ! -d .git ]; then
            git init -b price-data .
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git checkout -B price-data
          git config user.name "ga4-snapshot[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/ga4-latest.json data/ga4-history.json
          [ -f data/bing-latest.json ] && git add data/bing-latest.json || true
          if git diff --cached --quiet; then
            echo "No GA4 changes."
            exit 0
          fi
          git commit -m "ga4-snapshot: $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin price-data && git push -u origin price-data && exit 0
            echo "push attempt $i lost a race with another price-data writer; retrying"; sleep $((i*20))
          done
          echo "::error::could not push the GA4 snapshot after 5 attempts"; exit 1
