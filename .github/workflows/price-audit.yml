name: price-audit

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC ≈ 8:00am PT
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["*.html"]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run pricing audit
        id: audit
        run: |
          set +e
          node tools/audit-prices.mjs --json audit-report.json | tee audit-report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pricing-audit-report
          path: |
            audit-report.txt
            audit-report.json

      - name: Open/update issue on failure
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '```\n' + fs.readFileSync('audit-report.txt', 'utf8') + '\n```';
            const title = 'Pricing integrity: placeholder or broken affiliate link detected';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pricing-audit'
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pricing-audit']
              });
            }

      - name: Fail the run if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
