# Nightly price snapshot - zero-secret path (GitHub Actions).
# Prices every watchlist card off the site's own public /api/comps endpoint
# (eBay Browse, already live on Vercel) and commits the two JSON feeds to the
# isolated price-data branch. The signal board on /bowman-bangers and the
# homepage top-5 panel read that branch's raw URL and switch from seed prices
# to live data automatically. Setup required: none - no secrets, no tokens.
# Optional: add KIT_API_KEY secret to activate flip-alert emails + the Monday
# Tape Recap draft (tools/price-engine/newsletter.mjs).

name: price-snapshot

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Oct 7 2026: run #72 lost the whole night's snapshot when ga4-snapshot pushed to price-data mid-run
# (both schedules drift into the same 15:30 UTC window) and this job's push was rejected non-fast-forward.
# Same group as ga4-snapshot so the two price-data writers never overlap; the push below also rebases + retries.
concurrency:
  group: price-data-writers
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout price-data branch (may not exist yet)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: price-data
          path: price-data

      - name: Prepare data dir
        run: mkdir -p price-data/data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run snapshot
        run: node tools/price-engine/snapshot-free.mjs --watchlist data/watchlist.json --out price-data/data

      # Sold marks (2026-09-24, Mo: "fold that into a github automation for all users of the site nightly").
      # Dated SportsCardsPro / PriceCharting sales for every card in data/price-universe.json -> the Vault's
      # sold catalog. Never asks (R20); no titles/sellers stored (R17). A failure here never blocks the
      # ask-engine feed above: the Vault keeps yesterday's sold marks.
      - name: Sold marks (dated sales, not asks)
        continue-on-error: true
        timeout-minutes: 60
        run: node tools/price-engine/sold-marks.mjs --universe data/price-universe.json --out price-data/data/sold-marks.json --hist price-data/data

      - name: Newsletter (flip alerts + Monday recap draft)
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: |
          if [ -f tools/price-engine/newsletter.mjs ]; then
            node tools/price-engine/newsletter.mjs --history price-data/data/prices-history.json
          else
            echo "newsletter.mjs not on main yet - skipping"
          fi

      - name: Commit and push to price-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd price-data
          if [ ! -d .git ]; then
            git init -b price-data .
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git checkout -B price-data
          git config user.name "price-engine[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes tonight."
            exit 0
          fi
          git commit -m "price-engine: snapshot $(date -u +%F)"
          # Another writer (ga4-snapshot) may have pushed meanwhile: rebase onto it and retry.
          # The two jobs touch disjoint files (prices-*/market-*/sold-*/listings-* vs ga4-*), so the rebase is clean.
          for attempt in 1 2 3; do
            if git push -u origin price-data; then exit 0; fi
            echo "push rejected (another writer pushed meanwhile) - rebasing and retrying ($attempt/3)"
            git pull --rebase origin price-data || { git rebase --abort 2>/dev/null; echo "::error::rebase onto origin/price-data failed - snapshot not pushed"; exit 1; }
            sleep 10
          done
          echo "::error::could not push the snapshot after 3 attempts"; exit 1

      # Compliance Phase 1 (2026-09-22): the site serves the feed from its own origin, so the repo can
      # go private. Copy ONLY the three derived public files onto main under data/feed/ — the push
      # triggers one Vercel deploy a night. listings-history.json and ga4-*.json never leave price-data.
      - name: Publish the public feed to the site (data/feed on main)
        run: |
          set -e
          git config user.name "price-engine[bot]"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            mkdir -p data/feed
            for f in prices-latest.json prices-history.json market-latest.json; do
              cp "price-data/data/$f" "data/feed/$f"
            done
            # sold catalog (2026-09-24): published only when tonight's run produced it
            for f in sold-marks.json sold-history.json; do
              if [ -f "price-data/data/$f" ]; then cp "price-data/data/$f" "data/feed/$f"; fi
            done
            # R20 (2026-09-23): no eBay listing titles in the public feed.
            node tools/ci/strip-feed-titles.mjs data/feed/prices-latest.json data/feed/prices-history.json data/feed/market-latest.json
            git add data/feed
            # Sector-model set indices (2026-09-25, TH26 first): twice-weekly marks, Monday and Thursday (UTC date),
            # from PriceCharting dated solds — rulebook §5. The tool is a no-op on other days and on a day already
            # marked. A failure never blocks the feed: the index keeps its last mark and the page its last bake.
            if node tools/build-sector-index.mjs --ticker TH26 --mark --if-mark-day; then git add data/indices.json data/cards data/card-search.json pokemon-30th-anniversary-2026.html
            else echo "::warning::TH26 mark failed - level and page keep the previous mark"; git checkout -- data/indices.json data/cards data/card-search.json pokemon-30th-anniversary-2026.html; fi
            if node tools/build-sector-index.mjs --ticker SV151 --mark --if-mark-day; then git add data/indices.json data/cards data/card-search.json scarlet-violet-151-index.html
            else echo "::warning::SV151 mark failed - level and page keep the previous mark"; git checkout -- data/indices.json data/cards data/card-search.json scarlet-violet-151-index.html; fi
            # Modern whole-set adds (Oct 4 2026, Mo: "add Surging Sparks and the Mega Evolution base set as indices"): same rule.
            if node tools/build-sector-index.mjs --ticker SSP24,MEG25 --mark --if-mark-day; then git add data/indices.json data/cards data/card-search.json surging-sparks-index.html mega-evolution-index.html
            else echo "::warning::SSP24/MEG25 marks failed - levels and pages keep the previous mark"; git checkout -- data/indices.json data/cards data/card-search.json surging-sparks-index.html mega-evolution-index.html; fi
            # Bowman trio (Sep 25 2026): one call, every page read shared — BOW26 is the union of BB26 + BCB26 (+ BD26 in Dec)
            if node tools/build-sector-index.mjs --ticker BOW26,BB26,BCB26 --mark --if-mark-day; then git add data/indices.json data/cards data/card-search.json bowman-1st-chrome-index.html bowman-2026-index.html bowman-chrome-2026-index.html
            else echo "::warning::Bowman mark failed - levels and pages keep the previous mark"; git checkout -- data/indices.json data/cards data/card-search.json bowman-1st-chrome-index.html bowman-2026-index.html bowman-chrome-2026-index.html; fi
            # Classic Pokémon sets (Sep 28 2026, Mo: "add at least 10+ more indices for pokemon ... popular sets from the past"):
            # the classic sets + the WOTC 1st Edition / Shadowless prints (Neo Discovery + Neo Revelation pairs joined Oct 4 2026),
            # one call, same Mon/Thu schedule and the same never-block-the-feed rule. Team Up (TU19) joined Oct 4 2026 (build E).
            if node tools/build-sector-index.mjs --ticker BS99,JU99,FO99,TR00,NG00,NDC01,NR01,ND02,AQ03,SK03,HF19,TU19,EVS21,CEL21,CZ23,BS1E,BSSL,JU1E,FO1E,TR1E,NG1E,NDC1E,NR1E,ND1E --mark --if-mark-day; then git add data/indices.json data/cards data/card-search.json pokemon-base-set-index.html pokemon-jungle-index.html pokemon-fossil-index.html team-rocket-index.html neo-genesis-index.html neo-destiny-index.html aquapolis-index.html skyridge-index.html hidden-fates-index.html evolving-skies-index.html celebrations-index.html crown-zenith-index.html pokemon-base-set-1st-edition-index.html pokemon-base-set-shadowless-index.html pokemon-jungle-1st-edition-index.html pokemon-fossil-1st-edition-index.html team-rocket-1st-edition-index.html neo-genesis-1st-edition-index.html neo-discovery-index.html neo-revelation-index.html neo-discovery-1st-edition-index.html neo-revelation-1st-edition-index.html neo-destiny-1st-edition-index.html team-up-index.html
            else echo "::warning::classic-set marks failed - levels and pages keep the previous mark"; git checkout -- data/indices.json data/cards data/card-search.json pokemon-base-set-index.html pokemon-jungle-index.html pokemon-fossil-index.html team-rocket-index.html neo-genesis-index.html neo-destiny-index.html aquapolis-index.html skyridge-index.html hidden-fates-index.html evolving-skies-index.html celebrations-index.html crown-zenith-index.html pokemon-base-set-1st-edition-index.html pokemon-base-set-shadowless-index.html pokemon-jungle-1st-edition-index.html pokemon-fossil-1st-edition-index.html team-rocket-1st-edition-index.html neo-genesis-1st-edition-index.html neo-discovery-index.html neo-revelation-index.html neo-discovery-1st-edition-index.html neo-revelation-1st-edition-index.html neo-destiny-1st-edition-index.html team-up-index.html; fi
            # Graded ladder (Sep 30 2026, Mo: raw vs PSA 9 vs PSA 10 vs TAG on every Pokémon index card): one PriceCharting
            # read per card, Mondays only (UTC), ~25 min (~35 min from Oct 5 2026: + chase-index cards, + universe cards outside
            # the level, + TU19 — build E). Never blocks the feed: a failed or timed-out run writes nothing and
            # /card keeps the previous read (the page shows the read date).
            if [ "$(date -u +%u)" = "1" ]; then
              if timeout 50m node tools/build-card-ladder.mjs --workers 3 --pause 1400; then git add data/cards
              else echo "::warning::graded ladder failed - card pages keep the previous read"; git checkout -- data/cards; fi
            fi
            # crawlable-copy-integrity (2026-09-24, CoS-commissioned): / is pre-rendered from this feed for
            # crawlers and JS-off readers. Publishing the feed without re-baking it left / serving a stale
            # dashboard (Sep 18: a reversed SELL; Sep 24: stamp Sep 22, Gage Jump SELL vs the feed's HOLD).
            # Re-bake in the SAME commit so the served copy and the feed move together. A failed bake never
            # blocks the feed: / keeps its last bake and audit-terminal's home-feed-day FAILs (gate-watch).
            if FEED_BASE=data/feed node tools/build-home.mjs; then git add index.html
            else echo "::warning::build-home failed - / keeps its previous bake; home-feed-day will FAIL"; git checkout -- index.html; fi
            # /release-calendar (Sep 26 2026): the "This week / Just released" buckets move with the date, so re-bake nightly.
            if node tools/build-release-calendar.mjs; then git add release-calendar.html
            else echo "::warning::build-release-calendar failed - page keeps its previous bake"; git checkout -- release-calendar.html; fi
            # /badge/<TICKER>.svg (Oct 2 2026, Ledger #52): embeddable index badges drawn from indices.json; redraw after each re-mark.
            if node tools/build-badges.mjs; then git add badge
            else echo "::warning::build-badges failed - badges keep their previous draw"; git checkout -- badge 2>/dev/null || true; fi
            if git diff --cached --quiet; then echo "Feed unchanged."; exit 0; fi
            git commit -q -m "feed: nightly $(date -u +%F)"
            if git push -q origin main; then echo "Feed published."; exit 0; fi
            echo "push rejected (a lane pushed meanwhile) - retrying"; sleep 10
          done
          echo "could not publish the feed after 3 attempts"; exit 1
